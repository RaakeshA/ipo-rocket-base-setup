name: Daily IPO scan

on:
  schedule:
    # Runs Monday-Friday at 4:00 PM IST, after NSE market close.
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scripts/daily_scan.py

      - name: Commit latest scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/scans/latest.csv outputs/scans/latest_summary.csv outputs/scans/watchlist_history.csv
          if git diff --cached --quiet; then
            echo "No scan result changes to commit."
          else
            git commit -m "Update daily IPO scan"
            git push
          fi
